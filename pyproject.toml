[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promoter-dna-generator"
version = "1.0.0"
description = "Reproducible generation and evaluation of bacterial promoter DNA sequences"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "clearml>=1.16,<3",
    "joblib>=1.3,<2",
    "numpy>=1.23,<3",
    "plotly>=5.18,<7",
    "scikit-learn>=1.3,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<7",
]

[project.scripts]
promoter-gen = "promoter_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

